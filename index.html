<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries Information</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <main>
        <label for="country">
            Enter A Language
        </label>
        <input type="search" name="country" id="country" placeholder="Enter Language">

        <div id="countries">
            <h2>Countries</h2>
            <ul id="countriesUL"></ul>

        <div id="currency">
            <h2>Currency</h2>
            <ul id="currenciesUL"></ul>
        </div>
    </section>
    <script src="/js/index.js"></script>
</body>
</html>
